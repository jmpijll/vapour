name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            src-dnsproxy/go.sum
            sidecar/librespeed/go.sum
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install pnpm
        run: npm install --global pnpm@11.27.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test verified capture dependency setup
        run: ./scripts/test-setup-windivert.ps1
      - name: Stage verified capture dependency
        run: ./scripts/setup-windivert.ps1
      - name: Frontend checks
        run: |
          pnpm lint
          pnpm build
          node --experimental-strip-types --test src/utils/sessionHistory.test.ts src/utils/speedtest.test.ts
      - name: UI mode checks
        run: pnpm exec playwright test
      - name: Rust checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Speedtest engine checks
        working-directory: sidecar/librespeed
        run: go test ./...
      - name: DNS companion tests
        working-directory: src-dnsproxy
        run: go test ./...
      - name: DNS companion vet
        working-directory: src-dnsproxy
        run: go vet ./...
      - name: Standalone build
        run: pnpm build:native
      - name: Package Windows review build
        run: ./scripts/package-review.ps1 -Executable ./src-tauri/target/release/vapour.exe -Destination "${{ runner.temp }}/vapour-review"
      - name: Upload Windows review build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vapour-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/vapour-review/
          if-no-files-found: error
          retention-days: 14
