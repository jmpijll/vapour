name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install pnpm
        run: npm install --global pnpm@11.27.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage verified capture dependency
        run: ./scripts/setup-windivert.ps1
      - name: Frontend checks
        run: |
          pnpm lint
          pnpm build
          node --experimental-strip-types --test src/utils/sessionHistory.test.ts src/utils/speedtest.test.ts
      - name: UI mode checks
        run: pnpm exec playwright test
      - name: Rust checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Speedtest engine checks
        working-directory: sidecar/librespeed
        run: go test ./...
      - name: Standalone build
        run: pnpm build:native
